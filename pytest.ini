[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    p1: Critical priority test cases
    p2: High priority test cases
    p3: Medium priority test cases
    p4: Low priority test cases
    smoke: Smoke / happy-path tests
    boundary: Boundary value tests
    security: Security-related tests (injection, enumeration, etc.)
    responsive: Responsive / cross-viewport layout tests
    accessibility: Keyboard and accessibility tests

addopts = -v --strict-markers --tb=short
log_cli = true
log_cli_level = INFO
